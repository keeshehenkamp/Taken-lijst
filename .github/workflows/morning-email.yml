name: Ochtend-email takenlijst

on:
  schedule:
    # GitHub start geplande runs soms uren te laat, vooral op het hele uur.
    # Daarom meerdere vroege pogingen op :17; de eerste die draait na 04:00 NL
    # verstuurt de mail, de rest ziet dat hij al weg is.
    - cron: '17 2 * * *'
    - cron: '17 3 * * *'
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:  # handmatig starten voor testen — knop op GitHub

jobs:
  send-morning-email:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Afhankelijkheden installeren
        run: npm install
        working-directory: ./scripts

      - name: Ochtend-email versturen
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          GMAIL_USER:                ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:           ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: node morning-email.js
