name: Ochtend-email takenlijst

on:
  # Uitgezet op 7-10-2026: het ochtendoverzicht komt nu van een Claude-routine
  # (zie ochtendoverzicht/). Handmatig starten kan nog via de knop op GitHub.
  workflow_dispatch:

jobs:
  send-morning-email:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Afhankelijkheden installeren
        run: npm install
        working-directory: ./scripts

      - name: Ochtend-email versturen
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          GMAIL_USER:                ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:           ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: node morning-email.js
